# Story 001 / Scenario: 賺錢（直接打代號）
# iOS Expo Go 的 appId 是 host.exp.Exponent，Android 是 host.exp.exponent
appId: host.exp.Exponent
---
- launchApp
# Story 013：第一次開啟會先跳免責聲明，有就按掉
- runFlow:
    when:
      visible: "我已了解並同意"
    commands:
      - tapOn: "我已了解並同意"
- tapOn: "股票代號或名稱"
- inputText: "2330"
- tapOn: "買入價"
- inputText: "500"
- tapOn: "數量"
- inputText: "1000"
- tapOn: "計算"
- assertVisible: "賺了"
- assertVisible: "+20,000"
- assertVisible: "+4.00%"
