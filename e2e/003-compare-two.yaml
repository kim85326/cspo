# Story 003 / Scenario: 兩檔一賺一虧
# 兩檔的欄位 label 相同，用 index 區分（0 = 第 1 檔，1 = 第 2 檔）
appId: host.exp.Exponent
---
- launchApp
# Story 013：第一次開啟會先跳免責聲明，有就按掉
- runFlow:
    when:
      visible: "我已了解並同意"
    commands:
      - tapOn: "我已了解並同意"
# Story 011：試算畫面搬到首頁底部的「快速試算」；有持股時在畫面下方，先捲過去
- scrollUntilVisible:
    element: "快速試算"
- tapOn: "快速試算"
- tapOn: "新增一檔比較"
- tapOn:
    text: "股票代號或名稱"
    index: 0
- inputText: "2317"
- tapOn:
    text: "買入價"
    index: 0
- inputText: "200"
- tapOn:
    text: "數量"
    index: 0
- inputText: "1000"
- tapOn:
    text: "股票代號或名稱"
    index: 1
- inputText: "2330"
- tapOn:
    text: "買入價"
    index: 1
- inputText: "500"
- tapOn:
    text: "數量"
    index: 1
- inputText: "1000"
- tapOn: "計算並比較"
- assertVisible: "表現最好"
- assertVisible: "+20,000"
- assertVisible: "-20,000"
- assertVisible: "整體不賺不賠"
