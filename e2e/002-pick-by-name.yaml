# Story 002 / Scenario: 打部分公司名稱，從清單點選
appId: host.exp.Exponent
---
- launchApp
# Story 013：第一次開啟會先跳免責聲明，有就按掉
- runFlow:
    when:
      visible: "我已了解並同意"
    commands:
      - tapOn: "我已了解並同意"
# Story 011：試算畫面搬到首頁底部的「快速試算」；有持股時在畫面下方，先捲過去
- scrollUntilVisible:
    element: "快速試算"
- tapOn: "快速試算"
- tapOn: "股票代號或名稱"
- inputText: "聯"
- assertVisible: "聯發科"
- tapOn: "聯發科"
- assertVisible: "聯發科（2454）"
- tapOn: "買入價"
- inputText: "1000"
- tapOn: "數量"
- inputText: "100"
- tapOn: "計算"
- assertVisible: "+20,000"
